name: CI

# Läuft bei jedem Push und PR. Push-Builds produzieren zusätzlich das
# gebündelte forge-Binary als Artefakt; Tag-Pushes (v*) hängen es an ein
# GitHub-Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # für Release-Upload bei Tag-Pushes

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --extra dev

      - name: Ruff
        run: uv run ruff check packages/

      - name: Pytest
        # COLUMNS erzwingt eine feste Terminalbreite — sonst meldet der
        # Runner Breite 0, Rich/Typer schneidet die `--help`-Tabelle ab und
        # der board-loop-Help-Test sieht `--auto-merge` nicht.
        env:
          COLUMNS: "200"
        run: uv run pytest -v --tb=short

  build:
    name: Build forge.exe (windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Build binary
        run: uv run --with pyinstaller python packaging/build_binary.py

      - name: Smoke test
        shell: pwsh
        run: |
          dist/forge.exe --help
          # Volles Init→Doctor in einem frischen Repo: prüft, dass die
          # gebündelten Daten (Templates, tzdata) und die Default-Spec taugen.
          $tmp = Join-Path $env:RUNNER_TEMP "forge-smoke"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Push-Location $tmp
          git init -q
          & "$env:GITHUB_WORKSPACE/dist/forge.exe" init
          & "$env:GITHUB_WORKSPACE/dist/forge.exe" doctor
          Pop-Location

      - name: Build installer (forge-setup.exe)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $version = if ($env:GITHUB_REF -like "refs/tags/v*") {
            $env:GITHUB_REF_NAME.TrimStart("v")
          } else { "0.7.0-dev+$($env:GITHUB_SHA.Substring(0,7))" }
          iscc "/DAppVersion=$version" packaging/windows/forge.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-windows-x64
          path: |
            dist/forge.exe
            dist/forge-setup.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/forge.exe
            dist/forge-setup.exe
