name: CI

# Läuft bei jedem Push und PR. Push-Builds produzieren zusätzlich das
# gebündelte forge-Binary als Artefakt; Tag-Pushes (v*) hängen es an ein
# GitHub-Release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # für Release-Upload bei Tag-Pushes

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages --extra dev

      - name: Ruff
        run: uv run ruff check packages/

      - name: Pytest
        # Der board-loop-Help-Test sucht `--auto-merge` als Literal im
        # `--help`-Output. Auf dem Runner ist FORCE_COLOR gesetzt, wodurch
        # Rich/Typer ANSI-Codes mitten in den Optionsnamen einstreut
        # (`-`,`-auto`,`-merge` separat eingefärbt) — die Teilkette existiert
        # dann nicht mehr. TERM=dumb + NO_COLOR erzwingen Plain-Text-Rendering,
        # COLUMNS=200 verhindert zusätzlich breitenbedingtes Abschneiden.
        env:
          TERM: dumb
          NO_COLOR: "1"
          COLUMNS: "200"
        run: uv run pytest -v --tb=short

  build:
    name: Build forge.exe (windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Build binary
        run: uv run --with pyinstaller python packaging/build_binary.py

      - name: Smoke test
        run: dist/forge.exe --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-windows-x64
          path: dist/forge.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/forge.exe
