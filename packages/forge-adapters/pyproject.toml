[project]
name = "forge-adapters"
version = "0.1.0"
description = "Integrationen — GitHub, Slack"
requires-python = ">=3.12"
dependencies = [
    "forge-core",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_adapters"]
