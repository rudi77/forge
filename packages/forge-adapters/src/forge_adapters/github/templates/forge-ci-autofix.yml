name: forge — CI auto-fix

on:
  workflow_run:
    workflows: ["CI"]  # passe an den Namen des Haupt-CI-Workflows an
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  forge-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: forge-ci-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv + forge + claude
        run: |
          pip install uv
          uv pip install --system forge-cli
          npm install -g @anthropic-ai/claude-code

      - name: Run forge against red CI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          forge run \
            --trigger ci_failure \
            --focus ci-fix-${{ github.event.workflow_run.head_branch }} \
            --prompt "Der CI-Build auf branch ${{ github.event.workflow_run.head_branch }} ist rot. Diagnostiziere das Problem aus den Test-Outputs und behebe die Ursache. Mach den kleinstmöglichen Fix." \
            --template-id "ci_failure_v1" \
            --max-iterations 3 \
            --model sonnet \
            --base ${{ github.event.workflow_run.head_branch }}
