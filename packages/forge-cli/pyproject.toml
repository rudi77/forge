[project]
name = "forge-cli"
version = "0.1.0"
description = "Endbenutzer-CLI: forge run, analyze, doctor, replay"
requires-python = ">=3.12"
dependencies = [
    "forge-core",
    "forge-execute",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
forge = "forge_cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_cli"]
