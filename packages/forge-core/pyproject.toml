[project]
name = "forge-core"
version = "0.1.0"
description = "Event-Schema, Store, Spec-Loader, CAS-Blobs, Replay"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "python-ulid>=2.7",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_core"]
