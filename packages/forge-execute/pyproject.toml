[project]
name = "forge-execute"
version = "0.1.0"
description = "Loop 1 — Runner, Strategies, Mutators, Evaluators, Capabilities"
requires-python = ">=3.12"
dependencies = [
    "forge-core",
    "pydantic>=2.7",
    "anyio>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_execute"]
