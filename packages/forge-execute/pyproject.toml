[project]
name = "forge-execute"
version = "0.1.0"
description = "Loop 1 — Runner, Strategies, Mutators, Evaluators, Capabilities"
requires-python = ">=3.12"
dependencies = [
    "forge-core",
    "pydantic>=2.7",
    "anyio>=4.4",
    "pathspec>=0.12",
    # IANA-Zeitzonen-DB für zoneinfo — Windows liefert sie nicht mit, wird aber
    # für das Parsen der Limit-Reset-Zeit ("resets 1pm (Europe/Vienna)") gebraucht.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge_execute"]
# Subagent-Markdowns als Package-Daten ausliefern, damit importlib.resources
# sie auch nach `pip install`/`uv tool install` findet. `artifacts` zieht die
# `.md` ins Wheel, ohne (wie ein `force-include` des ganzen Verzeichnisses) mit
# dem normalen Package-Globbing von `templates/__init__.py` zu kollidieren —
# das templates/-Verzeichnis ist seit dem `__init__.py` ein echtes Package.
artifacts = ["src/forge_execute/agents/templates/*.md"]
